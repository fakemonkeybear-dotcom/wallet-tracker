name: Wallet Analysis Pipeline

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TIME_BUDGET_SECONDS: "19800"
        run: python run.py

      - name: Commit and push results
        run: |
          git config user.name "wallet-analysis-bot"
          git config user.email "actions@github.com"
          git add wallet_analysis/
          git diff --quiet --cached || git commit -m "Update wallet analysis progress [skip ci]"
          git push
